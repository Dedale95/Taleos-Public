<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60">
  <!-- HSBC Hexagon mark: red square with white left & right triangles -->
  <rect x="0" y="0" width="60" height="60" fill="#DB0011"/>
  <polygon points="0,0 30,30 0,60" fill="white"/>
  <polygon points="60,0 30,30 60,60" fill="white"/>
  <!-- HSBC wordmark -->
  <text x="70" y="43" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="#DB0011" letter-spacing="1">HSBC</text>
</svg>
