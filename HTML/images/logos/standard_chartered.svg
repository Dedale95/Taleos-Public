<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" role="img" aria-label="Standard Chartered">
  <rect width="160" height="260" fill="white"/>
  <!-- Standard Chartered "SC" logo: two interweaving curved bands -->
  <!-- Blue band (#0066B3) and Green band (#44B244) -->
  <!-- The two bands form an S-shape together -->

  <!-- Green band (background layer, bottom arc curving left) -->
  <path d="M 130,22 C 160,22 168,50 150,72 C 136,88 108,92 88,92
           L 88,118 C 118,118 152,112 168,136 C 186,162 176,194 154,210
           C 138,220 118,222 98,220 L 98,196
           C 116,198 136,196 148,186 C 162,174 160,154 144,144
           C 130,136 108,136 88,136 L 88,66
           C 108,66 132,60 144,44 C 154,30 144,10 126,10
           L 130,22 Z" fill="#44B244"/>

  <!-- Blue band (foreground layer, top arc curving right) -->
  <path d="M 30,238 C 0,238 -8,210 10,188 C 24,172 52,168 72,168
           L 72,142 C 42,142 8,148 -8,124 C -26,98 -16,66 6,50
           C 22,40 42,38 62,40 L 62,64
           C 44,62 24,64 12,74 C -2,86 0,106 16,116
           C 30,124 52,124 72,124 L 72,194
           C 52,194 28,200 16,216 C 6,230 16,250 34,250
           L 30,238 Z" fill="#0066B3"/>

  <!-- Round end caps for blue band -->
  <circle cx="62" cy="52" r="12" fill="#0066B3"/>
  <circle cx="62" cy="238" r="12" fill="#0066B3"/>
  <!-- Round end caps for green band -->
  <circle cx="98" cy="208" r="12" fill="#44B244"/>
  <circle cx="130" cy="16" r="12" fill="#44B244"/>
</svg>
