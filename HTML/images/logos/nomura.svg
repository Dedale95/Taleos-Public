<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400">
  <!--
    Nomura Holdings — geometric mark
    Deux chevrons symétriques qui se rejoignent au bas-centre (270,400).
    Chaque chevron a une encoche triangulaire coupée dans sa partie basse.
    Couleur : Nomura red #B50C1E
  -->

  <!-- Chevron gauche :
       apex  (135, 0)
       jambe extérieure gauche → (0, 400)
       jambe extérieure droite → (270, 400)
       encoche basse : (95,400)→(135,255)→(175,400)
  -->
  <path fill="#B50C1E" d="
    M 135,0
    L 0,400
    L 95,400
    L 135,255
    L 175,400
    L 270,400
    Z
  "/>

  <!-- Chevron droit (symétrique) :
       apex  (405, 0)
       jambe extérieure gauche → (270, 400)
       jambe extérieure droite → (540, 400)
       encoche basse : (365,400)→(405,255)→(445,400)
  -->
  <path fill="#B50C1E" d="
    M 405,0
    L 270,400
    L 365,400
    L 405,255
    L 445,400
    L 540,400
    Z
  "/>
</svg>
