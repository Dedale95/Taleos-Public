<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" style="background:#fff">
  <!-- Lloyds Banking Group — cheval noir (Black Horse) + texte vert -->
  <!-- Horse silhouette simplified -->
  <g transform="translate(3,4)">
    <!-- Body -->
    <ellipse cx="17" cy="20" rx="10" ry="7" fill="#006A4E"/>
    <!-- Neck -->
    <path d="M20 14 C22 10 24 8 23 6 C21 4 18 5 17 8 C16 11 17 14 20 14Z" fill="#006A4E"/>
    <!-- Head -->
    <ellipse cx="22" cy="5" rx="4" ry="3" fill="#006A4E"/>
    <!-- Ear -->
    <path d="M23 2 L25 0 L24 3Z" fill="#006A4E"/>
    <!-- Legs -->
    <rect x="11" y="26" width="3" height="8" rx="1" fill="#006A4E"/>
    <rect x="16" y="26" width="3" height="8" rx="1" fill="#006A4E"/>
    <rect x="21" y="25" width="3" height="7" rx="1" fill="#006A4E"/>
    <!-- Tail -->
    <path d="M7 20 C4 22 3 26 5 28 C7 26 9 22 7 20Z" fill="#006A4E"/>
    <!-- Mane -->
    <path d="M19 8 C17 9 17 13 20 14 C21 11 22 8 19 8Z" fill="#00543D"/>
  </g>
  <!-- Text -->
  <text x="42" y="17" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#006A4E">Lloyds</text>
  <text x="42" y="27" font-family="Arial, sans-serif" font-size="7" font-weight="400" fill="#006A4E">Banking Group</text>
</svg>
