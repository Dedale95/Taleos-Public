name: Publish Public Site

permissions:
  contents: write

concurrency:
  group: taleos-publish-site
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "HTML/**"
      - "index.html"
      - "landing_page_finance.html"
      - "scraped_jobs_live.json"
      - "scraped_jobs.json"
      - "scraped_jobs_summary.json"
      - "scraped_jobs.csv"
      - ".github/workflows/publish-public-site.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v4

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: Dedale95/Taleos-Public
          # Ce workflow s'exécute déjà dans Taleos-Public : le jeton natif
          # suffit et évite un échec lorsque le secret privé n'y est pas défini.
          token: ${{ github.token }}
          path: public-repo

      - name: Sync public files only
        shell: bash
        run: |
          set -euo pipefail

          # ⚠️  Les JSON de données (scraped_jobs_*.json) sont générés exclusivement
          # par le CI public (update-job-offers.yml) et incluent toutes les sources
          # (JP Morgan, Goldman Sachs…). On les PRÉSERVE depuis le dépôt public,
          # sans jamais les écraser avec la version incomplète du dépôt privé.
          # On utilise des noms de backup basés sur le chemin complet (/ → _) pour
          # éviter les collisions entre HTML/scraped_jobs_live.json et scraped_jobs_live.json.
          mkdir -p /tmp/public-data
          for f in \
            HTML/scraped_jobs_live.json \
            HTML/scraped_jobs.json \
            HTML/scraped_jobs_full.json \
            HTML/scraped_jobs_summary.json \
            scraped_jobs_live.json \
            scraped_jobs.json \
            scraped_jobs_summary.json \
            scraped_jobs.csv; do
            bak_name="$(echo "$f" | tr '/' '_')"
            [ -f "public-repo/$f" ] && cp "public-repo/$f" "/tmp/public-data/${bak_name}.bak" && echo "💾 Sauvegardé: $f" || true
          done

          # Idem pour les JSON par source (scraped_jobs_<banque>.json) : sans cette
          # protection, ce workflow les réécrivait avec une version potentiellement
          # plus ancienne que main et entrait en conflit avec update-job-offers.yml.
          mkdir -p /tmp/public-data/HTML
          cp public-repo/HTML/scraped_jobs_*.json /tmp/public-data/HTML/ 2>/dev/null || true

          rm -rf public-repo/HTML
          cp -R HTML public-repo/HTML

          cp /tmp/public-data/HTML/scraped_jobs_*.json public-repo/HTML/ 2>/dev/null || true

          cp index.html public-repo/index.html
          cp landing_page_finance.html public-repo/landing_page_finance.html

          # Restauration des fichiers de données protégés depuis le dépôt public
          for f in \
            HTML/scraped_jobs_live.json \
            HTML/scraped_jobs.json \
            HTML/scraped_jobs_full.json \
            HTML/scraped_jobs_summary.json \
            scraped_jobs_live.json \
            scraped_jobs.json \
            scraped_jobs_summary.json \
            scraped_jobs.csv; do
            bak_name="$(echo "$f" | tr '/' '_')"
            bak="/tmp/public-data/${bak_name}.bak"
            [ -f "$bak" ] && cp "$bak" "public-repo/$f" && echo "✅ Préservé: $f" || echo "ℹ️  Absent dans le dépôt public: $f"
          done

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git add .
          git commit -m "chore: publish public site from private source"
          # main peut avoir avancé pendant le run (mise à jour quotidienne) : rebase + retry
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push refusé (tentative $i/5), nouvel essai"
            sleep $((i * 5))
          done
          exit 1
