<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img" aria-label="Bank of America">
  <!-- Fond rouge Bank of America -->
  <rect width="200" height="60" fill="#E31837" rx="4"/>
  <!-- Texte Bank of America en blanc -->
  <text x="100" y="22" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle" letter-spacing="0.5">BANK OF AMERICA</text>
  <!-- Sous-ligne Merrill Lynch -->
  <line x1="20" y1="30" x2="180" y2="30" stroke="white" stroke-width="0.5" opacity="0.6"/>
  <!-- Logo stylisé BofA — drapeau simplifié -->
  <text x="100" y="48" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="white" text-anchor="middle" opacity="0.9" letter-spacing="1">Merrill Lynch</text>
</svg>
